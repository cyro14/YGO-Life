<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duelist Idle Academy</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div id="game-container">
    <!-- Tela de Criação -->
    <div id="screen-creation" class="screen">
        <h1>Duelist Idle Academy</h1>
        <p class="subtitle">A Jornada do Rei dos Jogos</p>
        
        <div class="form-group">
            <label>Seu Nome:</label>
            <input type="text" id="playerName" value="Cyro">
        </div>
        <div class="form-group">
            <label>Arquétipo do Deck:</label>
            <select id="playerDeck">
                <option value="maquina">Máquina/Dragão (Foco: ATK Brutal)</option>
                <option value="mago">Mago/Fada (Foco: INT e Controle)</option>
                <option value="zumbi">Zumbi/Vampiro (Foco: HP e Retorno)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Espírito Guardião (Mascote):</label>
            <select id="playerSpirit">
                <option value="kuriboh">Kuriboh (Proteção de HP)</option>
                <option value="ojama">Ojama Amarelo (DP Extra)</option>
                <option value="mago_fe">Mago da Fé (Bônus de INT)</option>
            </select>
        </div>
        
        <button class="btn-primary" onclick="startGame()">Matricular-se na Academia</button>
    </div>

    <!-- HUD Principal -->
    <div id="hud">
        <span class="hud-hp">❤️ HP: <span id="v-hp">3</span></span>
        <span class="hud-dp">🪙 DP: <span id="v-dp">0</span></span>
        <span class="hud-atk">⚔️ ATK: <span id="v-atk">0</span></span>
        <span class="hud-int">🧠 INT: <span id="v-int">0</span></span>
    </div>
    
    <!-- Barra de Progresso do Dia -->
    <div id="idle-progress-container">
        <div id="idle-progress-bar"></div>
    </div>

    <!-- Palco / Área Visual -->
    <div id="stage">
        <div id="stage-overlay">Mês 1 - Semana 1 - <span id="v-dia">Segunda-feira</span></div>
        <div id="foco-overlay">Foco: ⚔️ Duelos</div>
        <img id="stage-image" src="" alt="Cenário">
    </div>

    <!-- Caixas de Interação -->
    <div id="dialog-box"></div>
    <div id="action-panel"></div>

    <!-- Tela Final (Fim de Jogo) -->
    <div id="screen-ending" class="screen" style="display: none;">
        <h2>Resultado da Carreira</h2>
        <div id="id-card">
            <div class="id-title">Licença de Duelista</div>
            <div class="id-stats">
                <div>👤 Nome: <span id="id-name"></span></div>
                <div>🎴 Deck: <span id="id-deck"></span></div>
                <div>⚔️ ATK: <span id="id-atk"></span></div>
                <div>🧠 INT: <span id="id-int"></span></div>
                <div>🎓 Status: <span id="id-year"></span></div>
            </div>
            <div class="id-rank" id="id-rank-title">Eliminado</div>
        </div>
        <button onclick="location.reload()">Jogar Novamente</button>
    </div>
</div>

<!-- Importação dos Scripts (Ordem importa!) -->
<script src="js/data.js"></script>
<script src="js/game.js"></script>
</body>
</html>
